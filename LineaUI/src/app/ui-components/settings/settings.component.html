<div class="flex min-h-screen bg-background">
    <app-sidebar />
  
    <main class="ml-64 flex-1">
      <app-header />
  
      <div class="p-6">
        <div class="mb-6 animate-fade-in">
          <h2 class="text-2xl font-bold text-foreground">Settings</h2>
          <p class="text-muted-foreground">
            Configure system preferences and options
          </p>
        </div>
  
        <div class="grid gap-6 lg:grid-cols-2">
          <div
            class="rounded-lg border border-border bg-card animate-fade-in"
            style="animation-delay: 50ms"
          >
            <div class="border-b border-border p-4">
              <div class="flex items-center gap-3">
                <lucide-icon
                  [name]="settingsIcon"
                  class="h-5 w-5 text-primary"
                ></lucide-icon>
  
                <div>
                  <h3 class="font-semibold text-foreground">
                    General Settings
                  </h3>
                  <p class="text-sm text-muted-foreground">
                    Basic system configuration
                  </p>
                </div>
              </div>
            </div>
  
            <div class="space-y-4 p-4">
              <div class="space-y-2">
                <label for="company" class="text-sm font-medium">
                  Company Name
                </label>
                <input
                  id="company"
                  type="text"
                  [(ngModel)]="companyName"
                  class="w-full rounded-md border border-border bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
                />
              </div>
  
              <div class="space-y-2">
                <label for="timezone" class="text-sm font-medium">
                  Timezone
                </label>
                <input
                  id="timezone"
                  type="text"
                  [(ngModel)]="timezone"
                  class="w-full rounded-md border border-border bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
                />
              </div>
  
              <button
                (click)="save()"
                [disabled]="saving"
                class="inline-flex items-center rounded-md bg-primary px-4 py-2 text-primary-foreground hover:opacity-90 disabled:opacity-50"
              >
                {{ saving ? 'Saving...' : 'Save Changes' }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
