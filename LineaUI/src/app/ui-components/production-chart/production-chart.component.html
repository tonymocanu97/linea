<div
  class="chart-container animate-fade-in"
  [style.animationDelay]="animationDelay"
>
  <div class="mb-4 flex items-center justify-between">
    <div>
      <h3 class="text-lg font-semibold text-foreground">
        Production Output
      </h3>
      <p class="text-sm text-muted-foreground">
        24-hour production vs target
      </p>
    </div>

    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <div class="h-3 w-3 rounded-full bg-primary"></div>
        <span class="text-sm text-muted-foreground">Actual</span>
      </div>

      <div class="flex items-center gap-2">
        <div class="h-3 w-3 rounded-full bg-warning"></div>
        <span class="text-sm text-muted-foreground">Target</span>
      </div>
    </div>
  </div>

  <svg
    viewBox="0 0 800 300"
    class="w-full h-[300px]"
  >
    <defs>
      <linearGradient id="productionGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="hsl(187, 92%, 50%)" stop-opacity="0.3" />
        <stop offset="100%" stop-color="hsl(187, 92%, 50%)" stop-opacity="0" />
      </linearGradient>
    </defs>

    <g stroke="hsl(222, 47%, 16%)" stroke-dasharray="3 3">
      <ng-container *ngFor="let y of yTicks; let i = index">
        <line
          [attr.x1]="padding"
          [attr.x2]="width - padding"
          [attr.y1]="getY(y)"
          [attr.y2]="getY(y)"
        />
      </ng-container>
    </g>

    <g>
      <ng-container *ngFor="let y of yTicks">
        <text
          [attr.x]="padding - 6"
          [attr.y]="getY(y) + 4"
          text-anchor="end"
          fill="hsl(215, 20%, 55%)"
          font-size="12"
          font-family="system-ui, sans-serif"
        >
          {{ y }}
        </text>
      </ng-container>
    </g>

    <path
      [attr.d]="targetPath"
      fill="none"
      stroke="hsl(45, 93%, 47%)"
      stroke-width="2"
      stroke-dasharray="5 5"
      *ngIf="data.length"
    />

    <path
      [attr.d]="productionArea"
      fill="url(#productionGradient)"
      *ngIf="data.length"
    />

    <path
      [attr.d]="productionPath"
      fill="none"
      stroke="hsl(187, 92%, 50%)"
      stroke-width="2"
      *ngIf="data.length"
    />

    <g *ngFor="let point of data; let i = index">
      <text
        [attr.x]="getX(i)"
        y="285"
        text-anchor="middle"
        fill="hsl(215, 20%, 55%)"
        font-size="12"
        font-family="system-ui, sans-serif"
      >
        {{ point.time }}
      </text>
    </g>
  </svg>

  <div *ngIf="!data.length" class="text-sm text-muted-foreground mt-2">
    No production data available for this range.
  </div>
</div>
