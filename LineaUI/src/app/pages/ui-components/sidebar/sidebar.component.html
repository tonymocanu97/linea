<aside
  class="fixed left-0 top-0 z-40 flex h-screen w-64 flex-col border-r border-border bg-sidebar"
>
  <div class="flex h-16 items-center gap-3 border-b border-border px-4">
    <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-primary/10">
      <lucide-icon [name]="factory" class="h-6 w-6 text-primary"></lucide-icon>
    </div>

    <div>
      <h1 class="text-sm font-bold text-foreground">
        {{ companyName }}
      </h1>
      <p class="text-xs text-muted-foreground">Industrial Platform</p>
    </div>
  </div>

  <nav class="flex-1 space-y-1 overflow-y-auto p-3">
    <div class="mb-4">
      <p class="mb-2 px-3 text-xs font-semibold uppercase tracking-wider text-muted-foreground">
        Overview
      </p>

      <a
        *ngFor="let item of overviewItems"
        (click)="item.comingSoon && showComingSoon()"
        [routerLink]="item.comingSoon ? null : item.route"
        routerLinkActive="bg-primary/10 text-primary"
        [routerLinkActiveOptions]="{ exact: true }"
        class="group flex w-full cursor-pointer items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-all duration-200 hover:underline"
      >
        <lucide-icon
          [name]="item.icon"
          class="h-5 w-5 group-[.router-link-active]:text-primary"
        ></lucide-icon>

        <span class="flex-1 text-left">
          {{ item.label }}
        </span>
      </a>
    </div>

    <div class="mb-4">
      <p class="mb-2 px-3 text-xs font-semibold uppercase tracking-wider text-muted-foreground">
        Production
      </p>

      <a
        *ngFor="let item of productionItems"
        (click)="item.comingSoon && showComingSoon()"
        [routerLink]="item.comingSoon ? null : item.route"
        routerLinkActive="bg-primary/10 text-primary"
        [routerLinkActiveOptions]="{ exact: true }"
        class="group flex w-full cursor-pointer items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-all duration-200 hover:underline"
      >
        <lucide-icon
          [name]="item.icon"
          class="h-5 w-5 group-[.router-link-active]:text-primary"
        ></lucide-icon>

        <span class="flex-1 text-left">
          {{ item.label }}
        </span>

        <span
          *ngIf="(getBadgeCount(item) ?? 0) > 0"
          class="flex h-5 min-w-5 items-center justify-center rounded-full bg-destructive px-1.5 text-xs font-bold text-destructive-foreground"
        >
          {{ getBadgeCount(item) }}
        </span>
      </a>
    </div>

    <div class="mb-4">
      <p class="mb-2 px-3 text-xs font-semibold uppercase tracking-wider text-muted-foreground">
        Management
      </p>

      <a
        *ngFor="let item of managementItems"
        (click)="item.comingSoon && showComingSoon()"
        [routerLink]="item.comingSoon ? null : item.route"
        routerLinkActive="bg-primary/10 text-primary"
        [routerLinkActiveOptions]="{ exact: true }"
        class="group flex w-full cursor-pointer items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-all duration-200 hover:underline"
      >
        <lucide-icon
          [name]="item.icon"
          class="h-5 w-5 group-[.router-link-active]:text-primary"
        ></lucide-icon>

        <span class="flex-1 text-left">
          {{ item.label }}
        </span>
      </a>
    </div>
  </nav>

  <div class="border-t border-border p-4">
    <div class="flex items-center gap-3 rounded-lg bg-secondary/50 p-3">
      <div class="relative">
        <div class="h-3 w-3 rounded-full bg-success"></div>
        <div class="absolute inset-0 h-3 w-3 animate-ping rounded-full bg-success opacity-50"></div>
      </div>

      <div>
        <p class="text-sm font-medium text-foreground">System Online</p>
        <p class="text-xs text-muted-foreground">All sensors active</p>
      </div>
    </div>
  </div>
</aside>
