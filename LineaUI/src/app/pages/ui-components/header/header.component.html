<header
  class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-border bg-background/80 px-6 backdrop-blur-sm"
>
  <div>
    <h1 class="text-xl font-semibold text-foreground">Production Dashboard</h1>
    <p class="text-sm text-muted-foreground">{{ currentDate }}</p>
  </div>

  <div class="flex items-center gap-4">
    <div class="hidden items-center gap-2 rounded-lg bg-secondary px-3 py-1.5 md:flex">
      <div class="relative">
        <div class="h-2 w-2 rounded-full bg-success"></div>
        <div class="absolute inset-0 h-2 w-2 rounded-full bg-success opacity-50"></div>
      </div>
      <span class="font-mono text-sm text-primary">{{ currentTime }}</span>
    </div>

    <div class="relative">
      <button
        type="button"
        class="flex h-9 items-center gap-2 rounded-lg border border-border bg-secondary/50 px-3 text-sm text-muted-foreground transition-colors hover:bg-secondary hover:text-foreground"
        (click)="searchOpen = true"
        aria-label="Open search"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
        <span class="hidden md:inline">Search...</span>
        <kbd class="hidden rounded bg-muted px-1.5 py-0.5 text-[10px] font-medium md:inline">
          ⌘K
        </kbd>
      </button>

      @if (searchOpen) {
        <div
          class="fixed inset-0 z-40"
          (click)="searchOpen = false"
          aria-hidden="true"
        ></div>
        <app-search-dialog
          [open]="searchOpen"
          (openChange)="searchOpen = $event"
          class="absolute right-0 top-full z-50 mt-2"
        ></app-search-dialog>
      }
    </div>

    <div class="relative">
      <button
        type="button"
        class="relative flex h-9 w-9 items-center justify-center rounded-lg border border-border transition-colors hover:bg-secondary"
        (click)="notificationsOpen = true"
        aria-label="Open notifications"
      >
        <svg class="h-4 w-4 text-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
          />
        </svg>
      </button>

      @if (notificationsOpen) {
        <div
          class="fixed inset-0 z-40"
          (click)="notificationsOpen = false"
          aria-hidden="true"
        ></div>
        <div
          class="absolute right-0 top-full z-50 mt-2 w-80 rounded-lg border border-border bg-card p-4 shadow-lg"
          (click)="$event.stopPropagation()"
          role="dialog"
          aria-label="Notifications"
        >
          <h2 class="text-lg font-semibold text-foreground">Notifications</h2>
          <p class="mt-1 text-sm text-muted-foreground">You have 0 unread notifications.</p>
        </div>
      }
    </div>

    <button
      class="flex items-center gap-2 rounded-lg border border-border px-2 py-1.5 transition-colors hover:bg-secondary"
    >
      <div class="flex h-7 w-7 items-center justify-center rounded-full bg-primary/20">
        <svg class="h-4 w-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          />
        </svg>
      </div>
      <div class="hidden text-left md:block">
        <p class="text-sm font-medium text-foreground">Operator</p>
        <p class="text-xs text-muted-foreground">Shift A</p>
      </div>
    </button>
  </div>
</header>
