<div class="flex min-h-screen bg-background">
  <app-sidebar />

  <main class="ml-64 flex-1">
    <app-header />

    <div class="p-6">
      <div class="mb-6 flex items-center justify-between">
        <div>
          <h2 class="text-2xl font-bold text-foreground">Users</h2>
          <p class="text-muted-foreground">Manage user accounts and roles</p>
        </div>
        <button
          type="button"
          (click)="openAddModal()"
          class="inline-flex items-center gap-2 rounded-lg bg-primary px-4 py-2 text-sm font-medium text-primary-foreground cursor-pointer"
        >
          <lucide-icon [name]="plus" class="h-4 w-4"></lucide-icon>
          Add user
        </button>
      </div>

      @if (error) {
        <p class="mb-4 text-sm text-destructive">{{ error }}</p>
      }

      <div class="rounded-xl border border-border bg-card">
        @if (loading) {
          <p class="p-8 text-center text-muted-foreground">Loading...</p>
        } @else {
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="border-b border-border bg-muted/50">
                <tr>
                  <th class="px-4 py-3 text-left text-sm font-medium text-foreground">Username</th>
                  <th class="px-4 py-3 text-left text-sm font-medium text-foreground">Role</th>
                  <th class="px-4 py-3 text-left text-sm font-medium text-foreground">Created</th>
                  <th class="px-4 py-3"></th>
                </tr>
              </thead>
              <tbody>
                @for (u of users; track u.id) {
                  <tr class="border-b border-border last:border-0">
                    <td class="px-4 py-3">
                      <span class="font-medium text-foreground">{{ u.username }}</span>
                    </td>
                    <td class="px-4 py-3 text-muted-foreground">{{ u.role }}</td>
                    <td class="px-4 py-3 text-muted-foreground">{{ u.createdAt }}</td>
                    <td class="px-4 py-3">
                      <button
                        type="button"
                        (click)="deleteUser(u.id)"
                        class="rounded p-1 text-muted-foreground hover:bg-destructive/10 hover:text-destructive"
                        aria-label="Delete"
                      >
                        <lucide-icon [name]="trash2" class="h-4 w-4"></lucide-icon>
                      </button>
                    </td>
                  </tr>
                }
              </tbody>
            </table>
          </div>
        }
      </div>
    </div>
  </main>
</div>

@if (showAddModal) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50"
    (click)="closeAddModal()"
  >
    <div
      class="w-full max-w-md rounded-xl border border-border bg-card p-6"
      (click)="$event.stopPropagation()"
    >
      <h3 class="mb-4 text-lg font-semibold text-foreground">Add user</h3>
      <form (ngSubmit)="addUser()" class="space-y-4">
        <div>
          <label class="mb-1 block text-sm font-medium text-foreground">Username</label>
          <input
            type="text"
            [(ngModel)]="newUsername"
            name="newUsername"
            class="w-full rounded-lg border border-border bg-background px-3 py-2 text-foreground"
          />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-foreground">Password</label>
          <input
            type="password"
            [(ngModel)]="newPassword"
            name="newPassword"
            class="w-full rounded-lg border border-border bg-background px-3 py-2 text-foreground"
          />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-foreground">Role</label>
          <select
            [(ngModel)]="newRole"
            name="newRole"
            class="w-full rounded-lg border border-border bg-background px-3 py-2 text-foreground"
          >
            <option value="Operator">Operator</option>
            <option value="Engineer">Engineer</option>
            <option value="Supervisor">Supervisor</option>
          </select>
        </div>
        <div class="flex justify-end gap-2">
          <button
            type="button"
            (click)="closeAddModal()"
            class="rounded-lg border border-border px-4 py-2 cursor-pointer"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="rounded-lg bg-primary px-4 py-2 text-primary-foreground cursor-pointer"
          >
            Add
          </button>
        </div>
      </form>
    </div>
  </div>
}
