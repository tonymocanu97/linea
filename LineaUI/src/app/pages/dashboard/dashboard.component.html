<div class="flex min-h-screen bg-background">
  <main class="ml-64 flex-1">
    <app-header></app-header>

    <div class="p-6">
      <div class="mb-6">
        <h2 class="text-2xl font-bold text-foreground">
          Good morning, <span class="text-primary">Operator</span>
        </h2>
        <p class="text-muted-foreground">Here's your production overview for today</p>
      </div>

      <div class="mb-6 rounded-xl border border-border bg-card p-6">
        <div class="mb-4">
          <h3 class="text-lg font-semibold text-foreground">
            Overall Equipment Effectiveness (OEE)
          </h3>
          <p class="text-sm text-muted-foreground">Current production performance metrics</p>
        </div>

        <div class="flex flex-wrap items-center justify-around gap-6">
          <app-oee-gauge [value]="metrics.oee" label="Overall OEE" color="primary" />
          <app-oee-gauge [value]="metrics.availability" label="Availability" color="success" />
          <app-oee-gauge [value]="metrics.performance" label="Performance" color="warning" />
          <app-oee-gauge [value]="metrics.quality" label="Quality" color="success" />
        </div>
      </div>
    </div>
  </main>
</div>
