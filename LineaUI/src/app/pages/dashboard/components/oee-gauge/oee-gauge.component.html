<div class="flex flex-col items-center cursor-help" [attr.title]="tooltip">
  <div class="relative h-28 w-28">
    <svg class="h-full w-full -rotate-90" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="none" stroke="hsl(222, 47%, 16%)" stroke-width="8" />

      <circle
        cx="50"
        cy="50"
        r="45"
        fill="none"
        [ngClass]="ringClassList"
        stroke-width="8"
        stroke-linecap="round"
        [attr.stroke-dasharray]="circumference"
        [attr.stroke-dashoffset]="strokeDashoffset"
        style="transition: stroke-dashoffset 1s ease-in-out"
      />
    </svg>

    <div class="absolute inset-0 flex flex-col items-center justify-center">
      <span [ngClass]="textClassList"> {{ clampedValue }}% </span>
    </div>
  </div>

  <p class="mt-2 text-sm font-medium text-muted-foreground">
    {{ label }}
  </p>
</div>
