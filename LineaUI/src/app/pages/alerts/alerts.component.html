<div class="flex min-h-screen bg-background">
  <app-sidebar />

  <main class="ml-64 flex-1">
    <app-header />

    <div class="p-6">
      <div
        *ngIf="error$ | async as error"
        class="mb-6 rounded-lg border border-destructive/30 bg-destructive/10 p-4"
      >
        <p class="text-sm text-destructive">{{ error }}</p>
      </div>
      <div class="mb-6 flex items-center justify-between animate-fade-in">
        <div>
          <h2 class="text-2xl font-bold text-foreground">Alerts</h2>
          <p class="text-muted-foreground">System alerts and notifications</p>
        </div>
      </div>

      <div *ngIf="loading$ | async" class="mb-6 text-center">
        <p class="text-muted-foreground">Loading alerts...</p>
      </div>

      <div *ngIf="!(loading$ | async)" class="mb-6 grid gap-6 md:grid-cols-4">
        <div
          *ngFor="let stat of (stats$ | async) ?? []; let i = index"
          class="rounded-lg border border-border bg-card animate-fade-in"
          [style.animationDelay]="i * 50 + 'ms'"
        >
          <div class="flex items-center gap-3 p-6">
            <lucide-icon
              [name]="stat.icon"
              class="h-8 w-8"
              [ngClass]="stat.color || 'text-primary'"
            ></lucide-icon>

            <div>
              <p class="text-2xl font-bold text-foreground">
                {{ stat.value }}
              </p>
              <p class="text-sm text-muted-foreground">
                {{ stat.label }}
              </p>
            </div>
          </div>
        </div>
      </div>

      <div
        class="rounded-lg border border-border bg-card animate-fade-in"
        style="animation-delay: 200ms"
      >
        <div class="border-b border-border p-4">
          <h3 class="text-lg font-semibold text-foreground">Alert History</h3>
        </div>

        <div class="p-4">
          <div *ngIf="loading$ | async" class="text-center py-8">
            <p class="text-muted-foreground">Loading alerts...</p>
          </div>

          <div
            *ngIf="!(loading$ | async) && (alerts$ | async)?.length === 0"
            class="text-center py-8"
          >
            <p class="text-muted-foreground">No alerts found</p>
          </div>

          <ng-container *ngIf="alerts$ | async as alerts">
            <div *ngIf="!(loading$ | async) && alerts.length > 0" class="space-y-3">
              <div
                *ngFor="let alert of alerts"
                class="flex items-center justify-between rounded-lg border p-4 transition-colors"
                [ngClass]="alert.resolved ? 'border-border bg-secondary/30' : 'border-border'"
              >
                <div class="flex items-center gap-3">
                  <div
                    class="flex h-10 w-10 items-center justify-center rounded-lg"
                    [ngClass]="SEVERITY_STYLES[alert.severity].bg"
                  >
                    <lucide-icon
                      [name]="alertTriangle"
                      class="h-5 w-5"
                      [ngClass]="SEVERITY_STYLES[alert.severity].text"
                    ></lucide-icon>
                  </div>

                  <div>
                    <p class="font-medium text-foreground">
                      {{ alert.title }}
                    </p>
                    <p class="text-sm text-muted-foreground">
                      {{ alert.machine }} • {{ alert.time }}
                    </p>
                  </div>
                </div>

                <span
                  class="rounded px-3 py-1 text-xs font-medium"
                  [ngClass]="
                    alert.resolved
                      ? 'border border-border text-muted-foreground'
                      : 'bg-primary text-primary-foreground'
                  "
                >
                  {{ alert.resolved ? 'Resolved' : 'Active' }}
                </span>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </main>
</div>
